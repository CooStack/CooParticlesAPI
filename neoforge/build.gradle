plugins {
    id 'multiloader-loader'
    id 'net.neoforged.gradle.userdev'
}
tasks.javadoc {
    // 当前 Javadoc 配置存在编码问题，构建时不执行该任务。
    enabled = false
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

accessTransformers {
    file 'src/main/resources/META-INF/accesstransformer.cfg'
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly files(fileTree(dir: "../compile_only_depend", includes: ["iris-neoforge-1.11.7+mc26.3.jar"]))
    // NeoForge 外层发行包嵌套主体类；公共集成仅编译共享 API，不打包 Fabric 发行物。
    compileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
    implementation "thedarkcolour:kotlinforforge-neoforge:6.4.0"
    jarJar(implementation "com.ezylang:EvalEx:3.5.0")
    jarJar(implementation 'io.github.classgraph:classgraph:4.8.184')
}

runs {
    configureEach {
        systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
        modSource sourceSets.main
    }
    client {}
    server {
        argument '--nogui'
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom(localRuntime)
}

tasks.register("sourceWithCommon", Jar) {
    def current = tasks.named("sourcesJar").get()
    dependsOn(current)
    from current.outputs.files.collect { zipTree(it) }
    def other = project(":common").tasks.named("sourcesJar")
    dependsOn(other)
    from zipTree(other.get().archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
//    exclude "META-INT/**"
    destinationDirectory.set(file("../builds/sources"))
    archiveFileName = "${rootProject.mod_name}-NeoForge-Source-${rootProject.minecraft_version}-${rootProject.version}.jar"
}
tasks.named('jar', Jar) {
    // 普通 jar 仅作为 jarJar 的输入，避免被误当作完整发行物。
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    archiveClassifier.set("plain")
    archiveFileName.set("${rootProject.mod_name}-NeoForge-${rootProject.minecraft_version}-${rootProject.version}-plain.jar")
    dependsOn(tasks.named("sourceWithCommon"))
}
tasks.named('jarJar', Jar) {
    // 用户分发目录与 Maven 主工件共用包含运行库和 jarjar metadata 的完整工件。
    destinationDirectory.set(file("../builds/jar"))
    archiveClassifier.set("")
    archiveFileName.set("${rootProject.mod_name}-NeoForge-${rootProject.minecraft_version}-${rootProject.version}.jar")
}
tasks.named('assemble') {
    dependsOn(tasks.named("jarJar"))
}
def properties = new Properties()
def repoFile = rootProject.file("repo.properties")
if (repoFile.exists()) {
    repoFile.withInputStream { properties.load(it) }
}
repositories {
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = uri("https://maven.su5ed.dev/releases")
        content {
            includeGroup("org.sinytra.forgified-fabric-api")
        }
    }
    maven {
        name = "Kotlin for Forge"
        setUrl("https://thedarkcolour.github.io/KotlinForForge/")
    }
    maven {
        name = "jsdu-snapshot"
        url = "https://nexus.jsdu.cn/snapshots"
        mavenContent {
            snapshotsOnly()
        }
    }

    maven {
        name = "jsdu"
        url = "https://nexus.jsdu.cn/repository"
    }
    flatDir {
        dirs "../depend"
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group.toString()
            artifactId = "${rootProject.artifact}-${rootProject.minecraft_version}-neoforge"
            version = rootProject.version.toString()

            artifact(tasks.named("jarJar"))
            artifact(tasks.named("sourceWithCommon")) {
                classifier = "sources"
            }
        }
    }

    repositories {
        mavenLocal()
        maven {
            name = "repo"

            def isSnapshot = rootProject.version.toString().endsWith("SNAPSHOT")

            url = uri(
                    isSnapshot
                            ? "https://nexus.jsdu.cn/snapshots"
                            : "https://nexus.jsdu.cn/repository"
            )

            credentials {
                username = properties.getProperty("repo.user") ?: ""
                password = properties.getProperty("repo.password") ?: ""
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir '../fabric/src/main/generated/'
    exclude '**/.cache/**' // 排除 cache 文件夹
}
