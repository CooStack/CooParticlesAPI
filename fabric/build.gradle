plugins {
    id 'net.fabricmc.fabric-loom'
    id 'multiloader-loader'
    id 'org.jetbrains.kotlin.jvm'
}

tasks.javadoc {
    enabled = false
}

configurations {
    embed
    implementation.extendsFrom(embed)
}
repositories {
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    embed fileTree(dir: "../depend", includes: ["EvalEx-*.jar"])
    embed 'io.github.classgraph:classgraph:4.8.184'
    implementation fileTree(dir: "../depend", includes: ["EvalEx-*.jar"])
    implementation 'io.github.classgraph:classgraph:4.8.184'
    compileOnly fileTree(dir: "../compile_only_depend", includes: ["iris-fabric-1.11.7+mc26.3.jar"])
    compileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("sourceWithCommon", Jar) {
    def current = tasks.named("sourcesJar").get()
    dependsOn(current)
    from current.outputs.files.collect { zipTree(it) }
    def other = project(":common").tasks.named("sourcesJar")
    dependsOn(other)
    from zipTree(other.get().archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "META-INT/**"
    destinationDirectory.set(file("../builds/sources"))
    archiveFileName = "${rootProject.mod_name}-Fabric-Source-${rootProject.minecraft_version}-${rootProject.version}.jar"
}
afterEvaluate {
    configurations.runtimeClasspath.forEach { file ->
        if (file.name.startsWith("sponge-mixin")) {
            tasks.named("runClient", JavaExec) {
                jvmArgs("-javaagent:${file.absolutePath}")
//                jvmArgs("-XX:+AllowEnhancedClassRedefinition") // 如果你没有用jbr那么就删掉这行
            }
        }
    }
    tasks.named("runDatagen", JavaExec) {
        jvmArgs("-Dfabric-api.datagen.modid=${project.property("mod_id") as String}")
    }
}
tasks.named("jar", Jar) {
    from(configurations.embed.collect {
        it.isDirectory() ? it : zipTree(it)
    }) {
        // 排除可能冲突的文件
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    dependsOn(tasks.named("sourceWithCommon"))
}
tasks.named('jar', Jar) {
    destinationDirectory.set(file("../builds/jar"))
    archiveFileName.set("${rootProject.mod_name}-Fabric-${rootProject.minecraft_version}-${rootProject.version}.jar")
}
fabricApi {
    configureDataGeneration {
        client = true
        modId = "cooparticlesapi"
    }
}
def properties = new Properties()
def repoFile = rootProject.file("repo.properties")
if (repoFile.exists()) {
    repoFile.withInputStream { properties.load(it) }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = "${rootProject.artifact}-${rootProject.minecraft_version}-fabric"
            version = "${rootProject.version}"
            artifact(tasks.named("jar"))
            artifact(tasks.named("sourceWithCommon")) {
                classifier = "sources"
            }
        }
    }

    repositories {
        mavenLocal()
        maven {
            name = "repo"

            def isSnapshot = rootProject.version.toString().endsWith("SNAPSHOT")

            url = uri(
                    isSnapshot
                            ? "https://nexus.jsdu.cn/snapshots"
                            : "https://nexus.jsdu.cn/repository"
            )

            credentials {
                username = properties.getProperty("repo.user") ?: ""
                password = properties.getProperty("repo.password") ?: ""
            }
        }
    }
}
loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
