plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.107' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.2.0' apply false
    id 'maven-publish'
}
def properties = new Properties()
file('jsdu.properties').withInputStream { stream -> properties.load(stream) }

def mavenUsername = properties['mavenUsername']
def mavenPassword = properties['mavenPassword']
ext {
    mavenUser = mavenUsername
    mavenPwd = mavenPassword
}
repositories {
    maven {
        url 'https://nexus.jsdu.cn/repository/maven-releases/'
        credentials {
            username = mavenUsername
            password = mavenPassword
        }
    }
}


subprojects {
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'

    sourceSets {
        main.kotlin.srcDirs = ['src/main/java', 'src/main/kotlin']
    }

    compileKotlin {
        source(project(":common").sourceSets.main.allSource)
        inputs.file "../gradle.properties"
    }
}