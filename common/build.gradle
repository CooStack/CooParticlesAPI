plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
    id "java-library"
    id 'kotlin'
}
neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

}

tasks.javadoc {
    // fuck javadoc encode error
    enabled = false
}
dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly "org.ow2.asm:asm:9.7"
    // ASM tree API（包含 ClassNode 等）
    compileOnly "org.ow2.asm:asm-tree:9.7"
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly fileTree(dir: "../compile_only_depend", includes: ["*.jar"])
    implementation fileTree(dir: "../depend", includes: ["*.jar"])

    implementation 'io.github.classgraph:classgraph:4.8.184'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    testImplementation 'org.joml:joml:1.10.8'
}
tasks.named('jar', Jar) {
    destinationDirectory.set(file("../builds/jar"))
    archiveFileName.set("${rootProject.mod_name}-Common-${rootProject.minecraft_version}-${rootProject.version}.jar")
}


afterEvaluate {
    artifacts {
        commonJava sourceSets.main.java.sourceDirectories.files
        commonResources sourceSets.main.resources.sourceDirectories.files
    }

}


configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
