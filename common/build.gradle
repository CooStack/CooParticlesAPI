plugins {
    id 'multiloader-common'
    id 'net.neoforged.gradle.vanilla'
    id 'org.jetbrains.kotlin.jvm'
    id "java-library"
    id 'kotlin'
    id "org.jetbrains.kotlin.kapt"
}
accessTransformers {
    file("src/main/accessTransformers/compile.cfg")
}
tasks.javadoc {
    // 当前 Javadoc 配置存在编码问题，构建时不执行该任务。
    enabled = false
}
dependencies {
    implementation "net.minecraft:client:${minecraft_version}"
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly "org.ow2.asm:asm:9.7"
    // ASM tree API（包含 ClassNode 等）
    compileOnly "org.ow2.asm:asm-tree:9.7"
    // Fabric 和 NeoForge 都内置 MixinExtras，因此 common 可以安全引用。
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.5'
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    // NeoForge 发行包将主体 class 放在嵌套 JAR，common 编译使用直接包含主体的 Fabric 工件。
    compileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.5'
    compileOnly files(fileTree(dir: "../compile_only_depend", includes: ["iris-neoforge-1.11.7+mc26.3.jar"]))
    implementation fileTree(dir: "../depend", includes: ["EvalEx-*.jar"])

    implementation 'io.github.classgraph:classgraph:4.8.184'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    testImplementation 'org.joml:joml:1.10.8'
    testImplementation 'io.netty:netty-buffer:4.1.97.Final'
    testRuntimeOnly files(configurations.runtimeClasspath)
}
tasks.named('jar', Jar) {
    destinationDirectory.set(file("../builds/jar"))
    archiveFileName.set("${rootProject.mod_name}-Common-${rootProject.minecraft_version}-${rootProject.version}.jar")
}


afterEvaluate {
    artifacts {
        commonJava sourceSets.main.java.sourceDirectories.files
        commonResources sourceSets.main.resources.sourceDirectories.files
    }

}


configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
repositories {
    mavenCentral()
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
}
